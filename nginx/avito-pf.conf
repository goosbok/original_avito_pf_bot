# nginx site config for the avito-pf.com / lk.avito-pf.com split.
#
# Deploy:
#   ssh root@<server>
#   cp nginx/avito-pf.conf /etc/nginx/sites-available/avito-pf.conf
#   ln -sf /etc/nginx/sites-available/avito-pf.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# NB: The existing pf-bot.com server block currently shares :443 with shadowbox VPN
# via ssl_preread (see memory/infra_pf_bot_domain.md). Adding two new TLS hostnames
# (avito-pf.com, lk.avito-pf.com) requires updating that ssl_preread map to route
# both to nginx. This file does NOT manage ssl_preread — that is a separate concern
# living in the global nginx-stream config.
#
# TLS certificates: issued via certbot (webroot challenge). The /.well-known/
# acme-challenge/ location stays open on port 80 for renewals.

# Landing — статический сайт avito-pf.com.
# Файлы лежат в репозитории под web/landing/; nginx отдаёт их напрямую,
# никакого обращения к FastAPI не требуется.
server {
    listen 80;
    listen 443 ssl;
    server_name avito-pf.com;

    ssl_certificate     /etc/letsencrypt/live/avito-pf.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avito-pf.com/privkey.pem;

    root /app/web/landing;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
}

# ЛК — FastAPI + React SPA на lk.avito-pf.com.
server {
    listen 80;
    listen 443 ssl;
    server_name lk.avito-pf.com;

    ssl_certificate     /etc/letsencrypt/live/lk.avito-pf.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lk.avito-pf.com/privkey.pem;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
}
