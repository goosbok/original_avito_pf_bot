  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"1eda1b54-1e92-4c8e-9af1-0be1cade1b69\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n<style>\n  :root{\n    --ink:#13131f; --ink-2:#1b1b2b; --ink-3:#262638;\n    --light:#f4f5f8; --white:#ffffff;\n    --violet:#7c3aed; --violet-2:#9a6cf2; --violet-soft:rgba(124,58,237,0.12);\n    --lime:#a3e635;\n    --on-dark:#f4f5f8; --mut-dark:#8b8da4; --bd-dark:rgba(255,255,255,0.09);\n    --on-light:#13131f; --mut-light:#5c5e72; --bd-light:#e4e6ec;\n    --maxw:1180px;\n    --r:18px; --r-sm:12px;\n  }\n  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}\n  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}\n  body{\n    font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;\n    background:var(--ink); color:var(--on-light);\n    line-height:1.6; font-size:16px; -webkit-font-smoothing:antialiased;\n  }\n  img,svg{display:block;max-width:100%;}\n  a{text-decoration:none;color:inherit;}\n  ::selection{background:var(--lime);color:var(--ink);}\n\n  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px;}\n  .sec{padding:96px 0;}\n  .eyebrow{\n    display:inline-flex;align-items:center;gap:8px;\n    font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;\n    color:var(--violet);\n  }\n  .eyebrow::before{content:\"\";width:7px;height:7px;border-radius:50%;background:var(--lime);}\n  h1,h2,h3{letter-spacing:-0.03em;line-height:1.08;font-weight:800;}\n  h2{font-size:clamp(28px,4vw,44px);}\n  .lead{font-size:clamp(16px,2vw,19px);line-height:1.6;}\n\n  /* sections: dark / light */\n  .dark{background:var(--ink);color:var(--on-dark);}\n  .light{background:var(--light);color:var(--on-light);}\n  .dark .mut{color:var(--mut-dark);}\n  .light .mut{color:var(--mut-light);}\n\n  /* buttons */\n  .btn{\n    display:inline-flex;align-items:center;justify-content:center;gap:9px;\n    padding:14px 26px;border-radius:999px;font-family:inherit;\n    font-size:15px;font-weight:700;cursor:pointer;border:1.5px solid transparent;\n    transition:transform .12s ease, background .15s, border-color .15s, box-shadow .15s;\n    white-space:nowrap;\n  }\n  .btn:active{transform:scale(.97);}\n  .btn--primary{background:var(--violet);color:#fff;box-shadow:0 8px 24px rgba(124,58,237,.35);}\n  .btn--primary:hover{background:var(--violet-2);box-shadow:0 10px 30px rgba(124,58,237,.5);}\n  .btn--lime{background:var(--lime);color:var(--ink);}\n  .btn--lime:hover{filter:brightness(1.05);transform:translateY(-1px);}\n  .btn--ghost-d{background:transparent;color:var(--on-dark);border-color:var(--bd-dark);}\n  .btn--ghost-d:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.25);}\n  .btn--ghost-l{background:transparent;color:var(--on-light);border-color:var(--bd-light);}\n  .btn--ghost-l:hover{background:#fff;border-color:#c9ccd6;}\n  .btn--lg{padding:17px 34px;font-size:16px;}\n  /* prominent primary CTA */\n  .btn--cta{\n    background:var(--lime);color:var(--ink);font-weight:800;\n    font-size:17px;padding:19px 42px;letter-spacing:-0.01em;\n    box-shadow:0 10px 30px rgba(163,230,53,.42);\n    position:relative;overflow:visible;\n  }\n  .btn--cta::after{\n    content:\"\";position:absolute;inset:0;border-radius:inherit;\n    box-shadow:0 0 0 0 rgba(163,230,53,.55);\n  }\n  .btn--cta:hover{transform:translateY(-2px);box-shadow:0 16px 44px rgba(163,230,53,.6);filter:brightness(1.04);}\n  @media(prefers-reduced-motion:no-preference){\n    .btn--cta::after{animation:ctaPulse 2.4s ease-out infinite;}\n  }\n  @keyframes ctaPulse{0%{box-shadow:0 0 0 0 rgba(163,230,53,.5);}70%{box-shadow:0 0 0 16px rgba(163,230,53,0);}100%{box-shadow:0 0 0 0 rgba(163,230,53,0);}}\n  .cta-note{font-size:13px;color:var(--mut-dark);font-weight:600;}\n  .light .cta-note{color:var(--mut-light);}\n\n  /* ===== RANK / SERP CLIMB ===== */\n  .rank__grid{display:grid;grid-template-columns:1fr 1fr;gap:52px;align-items:center;}\n  .rank__lead{font-size:17px;color:var(--mut-dark);margin:14px 0 26px;}\n  .rank__deltas{display:flex;flex-direction:column;gap:14px;}\n  .delta{display:flex;align-items:baseline;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--bd-dark);}\n  .delta:last-child{border-bottom:none;}\n  .delta__k{flex:1;font-size:15px;color:var(--mut-dark);font-weight:600;}\n  .delta__v{font-size:22px;font-weight:800;color:#fff;letter-spacing:-0.02em;}\n  .delta__x{font-size:13px;font-weight:800;color:var(--ink);background:var(--lime);padding:3px 9px;border-radius:999px;}\n\n  .serp{\n    background:var(--ink-2);border:1px solid var(--bd-dark);border-radius:22px;\n    padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.45);\n  }\n  .serp__bar{\n    display:flex;align-items:center;gap:10px;background:var(--ink);\n    border:1px solid var(--bd-dark);border-radius:12px;padding:11px 14px;color:var(--mut-dark);font-size:14px;font-weight:600;\n  }\n  .serp__bar svg{flex-shrink:0;opacity:.6;}\n  .serp__count{font-size:12.5px;color:var(--mut-dark);font-weight:600;margin:14px 4px 12px;}\n  .serp__list{display:flex;flex-direction:column;gap:10px;}\n  .serprow{display:flex;align-items:center;gap:14px;}\n  .serprow__pos{\n    flex-shrink:0;width:26px;text-align:center;font-size:15px;font-weight:800;color:var(--mut-dark);letter-spacing:-0.02em;\n  }\n  .serprow__card{\n    flex:1;display:flex;align-items:center;gap:13px;background:var(--ink);\n    border:1px solid var(--bd-dark);border-radius:14px;padding:11px 13px;\n  }\n  .serprow__thumb{flex-shrink:0;width:50px;height:50px;border-radius:9px;background:rgba(255,255,255,.07);}\n  .serprow__meta{flex:1;min-width:0;}\n  .serprow__title{height:9px;border-radius:5px;background:rgba(255,255,255,.16);width:78%;margin-bottom:8px;}\n  .serprow__price{height:11px;border-radius:5px;background:rgba(255,255,255,.10);width:42%;}\n  .serprow--dim{opacity:.42;}\n  .serprow--you .serprow__pos{color:var(--lime);font-size:18px;}\n  .serprow--you .serprow__card{\n    background:linear-gradient(120deg,rgba(124,58,237,.22),rgba(163,230,53,.10));\n    border:1.5px solid var(--lime);box-shadow:0 0 0 4px rgba(163,230,53,.12),0 18px 40px rgba(124,58,237,.3);\n  }\n  .serprow--you .serprow__thumb{background:linear-gradient(135deg,var(--violet),var(--violet-2));}\n  .serprow--you .serprow__title{background:rgba(255,255,255,.85);width:70%;}\n  .serprow--you .serprow__price{background:var(--lime);width:38%;}\n  .you-tag{\n    flex-shrink:0;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;\n    color:var(--ink);background:var(--lime);padding:5px 11px;border-radius:999px;white-space:nowrap;\n  }\n  .serp__climb{\n    display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 4px;\n    font-size:13px;font-weight:700;color:var(--mut-dark);\n  }\n  .serp__climb b{color:var(--lime);}\n  .serp__dots{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 10px;color:var(--mut-dark);}\n  .serp__dots span{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.5;}\n\n  /* ===== ×2 PROMO BADGE ===== */\n  .promo-badge{\n    display:inline-flex;align-items:center;gap:10px;\n    background:linear-gradient(100deg,var(--lime),#c2f15e);\n    color:var(--ink);font-weight:800;font-size:14.5px;letter-spacing:-0.01em;\n    padding:10px 18px 10px 14px;border-radius:999px;white-space:nowrap;\n    box-shadow:0 8px 24px rgba(163,230,53,.36);\n  }\n  .promo-badge .gift{\n    display:inline-flex;width:26px;height:26px;border-radius:50%;\n    background:var(--ink);color:var(--lime);align-items:center;justify-content:center;\n    font-size:14px;flex-shrink:0;\n  }\n  .promo-badge .x2{font-weight:800;background:var(--ink);color:var(--lime);padding:2px 8px;border-radius:999px;font-size:13px;}\n\n  /* ===== HEADER ===== */\n  header.nav{\n    position:fixed;top:0;left:0;right:0;z-index:100;height:68px;\n    background:rgba(19,19,31,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);\n    border-bottom:1px solid var(--bd-dark);\n  }\n  .nav__in{max-width:var(--maxw);margin:0 auto;padding:0 24px;height:100%;display:flex;align-items:center;gap:28px;}\n  .logo{display:flex;align-items:center;gap:11px;}\n  .logo .mark{width:38px;height:38px;flex-shrink:0;border-radius:50%;object-fit:cover;background:#000;}\n  .logo .word{font-weight:800;font-size:21px;letter-spacing:-0.04em;color:#fff;}\n  .logo .word b{color:var(--violet-2);font-weight:800;}\n  .nav__links{display:flex;gap:26px;margin-left:8px;}\n  .nav__links a{font-size:14.5px;font-weight:600;color:var(--mut-dark);transition:color .15s;}\n  .nav__links a:hover{color:var(--on-dark);}\n  .nav__spacer{flex:1;}\n  .nav__cta{display:flex;align-items:center;gap:10px;}\n  .nav .btn{padding:10px 18px;font-size:14px;}\n  .tg-ic{width:16px;height:16px;}\n\n  /* ===== HERO ===== */\n  .hero{position:relative;overflow:hidden;padding:150px 0 96px;}\n  .hero__glow{\n    position:absolute;top:-160px;left:50%;transform:translateX(-50%);\n    width:900px;height:560px;pointer-events:none;\n    background:radial-gradient(ellipse at center,rgba(124,58,237,.42) 0%,rgba(124,58,237,0) 62%);\n    filter:blur(8px);\n  }\n  .hero__grid{\n    position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;\n  }\n  .hero h1{font-size:clamp(36px,5.4vw,62px);margin:20px 0 22px;}\n  .hero h1 .hl{color:var(--violet-2);}\n  .hero .lead{color:var(--mut-dark);max-width:520px;margin-bottom:34px;}\n  .hero__ctas{display:flex;flex-wrap:wrap;gap:14px;align-items:center;}\n  .hero__ctas .cta-note{width:100%;margin-top:2px;}\n  .hero__trust{margin-top:40px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;}\n  .hero__trust .num{font-size:26px;font-weight:800;color:#fff;letter-spacing:-0.03em;}\n  .hero__trust .lbl{font-size:13px;color:var(--mut-dark);line-height:1.3;}\n  .hero__trust .vr{width:1px;height:34px;background:var(--bd-dark);}\n\n  /* hero dashboard card */\n  .dash{\n    position:relative;background:linear-gradient(160deg,#20203200,#1c1c2b);\n    background-color:var(--ink-2);\n    border:1px solid var(--bd-dark);border-radius:24px;padding:24px;\n    box-shadow:0 30px 80px rgba(0,0,0,.5);\n  }\n  .dash__top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}\n  .dash__title{font-size:14px;font-weight:700;color:var(--on-dark);}\n  .dash__live{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--lime);}\n  .dash__live::before{content:\"\";width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 0 rgba(163,230,53,.6);animation:pulse 2s infinite;}\n  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(163,230,53,.55);}70%{box-shadow:0 0 0 10px rgba(163,230,53,0);}100%{box-shadow:0 0 0 0 rgba(163,230,53,0);}}\n  .dash__chart{background:var(--ink);border:1px solid var(--bd-dark);border-radius:16px;padding:16px 14px 8px;}\n  .dash__rank{display:flex;gap:10px;margin-top:14px;}\n  .rankcell{flex:1;background:var(--ink);border:1px solid var(--bd-dark);border-radius:14px;padding:13px 14px;display:flex;flex-direction:column;justify-content:space-between;min-height:78px;}\n  .rankcell .k{font-size:12px;color:var(--mut-dark);font-weight:600;}\n  .rankcell .v{font-size:22px;font-weight:800;color:#fff;letter-spacing:-0.03em;margin-top:auto;}\n  .rankcell .v small{font-size:13px;color:var(--lime);font-weight:700;margin-left:5px;letter-spacing:0;}\n  .float{position:absolute;border-radius:14px;}\n  .float--badge{\n    top:-18px;right:26px;background:var(--lime);color:var(--ink);\n    font-weight:800;font-size:14px;padding:9px 15px;border-radius:999px;\n    box-shadow:0 12px 28px rgba(163,230,53,.35);transform:rotate(-4deg);\n  }\n\n  /* intro strip */\n  .intro{padding:64px 0;border-top:1px solid var(--bd-dark);}\n  .intro__grid{display:grid;grid-template-columns:1fr 1.3fr;gap:48px;align-items:center;}\n  .intro h2{font-size:clamp(24px,3vw,34px);}\n  .intro p{color:var(--mut-dark);font-size:17px;}\n\n  /* ===== generic feature cards ===== */\n  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}\n  .head-block{max-width:720px;margin-bottom:48px;}\n  .head-block h2{margin:14px 0 14px;}\n  .head-block p{font-size:18px;}\n\n  .vcard{\n    background:var(--white);border:1px solid var(--bd-light);border-radius:var(--r);\n    padding:30px 26px;display:flex;flex-direction:column;gap:14px;\n    transition:transform .15s, box-shadow .2s;\n  }\n  .vcard:hover{transform:translateY(-3px);box-shadow:0 18px 44px rgba(19,19,31,.09);}\n  .vic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--violet-soft);}\n  .vcard h3{font-size:20px;}\n  .vcard p{color:var(--mut-light);font-size:15px;line-height:1.6;}\n\n  /* \"почему не растут\" - problem list */\n  .why{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:8px;}\n  .prob{\n    background:var(--white);border:1px solid var(--bd-light);border-radius:var(--r);\n    padding:26px;display:flex;gap:16px;align-items:flex-start;\n  }\n  .prob__ic{flex-shrink:0;width:44px;height:44px;border-radius:12px;background:#fdeceb;display:flex;align-items:center;justify-content:center;}\n  .prob h3{font-size:18px;margin-bottom:6px;}\n  .prob p{color:var(--mut-light);font-size:15px;}\n\n  /* ===== RESULTS (dark, image slots) ===== */\n  .results-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}\n  .shot{\n    background:var(--ink-2);border:1px solid var(--bd-dark);border-radius:16px;\n    padding:12px;display:flex;flex-direction:column;gap:12px;\n  }\n  /* ===== CLIENT RESULTS — metric cards ===== */\n  .results-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}\n  .rescard{\n    background:var(--ink-2);border:1px solid var(--bd-dark);border-radius:18px;\n    padding:24px 22px;display:flex;flex-direction:column;gap:18px;\n    transition:border-color .2s, transform .15s;\n  }\n  .rescard:hover{border-color:rgba(163,230,53,.4);transform:translateY(-3px);}\n  .rescard__top{display:flex;align-items:center;gap:12px;}\n  .rescard__ic{flex-shrink:0;width:46px;height:46px;border-radius:13px;background:rgba(124,58,237,.18);display:flex;align-items:center;justify-content:center;color:var(--violet-2);}\n  .rescard__niche{font-size:14.5px;font-weight:700;color:#fff;line-height:1.2;}\n  .rescard__city{font-size:12.5px;font-weight:600;color:var(--mut-dark);margin-top:2px;}\n  .rescard__hero{display:flex;align-items:baseline;gap:9px;padding:14px 0;border-top:1px solid var(--bd-dark);border-bottom:1px solid var(--bd-dark);}\n  .rescard__pos{font-size:38px;font-weight:800;color:var(--lime);letter-spacing:-0.03em;line-height:1;}\n  .rescard__poslbl{font-size:13px;font-weight:700;color:var(--mut-dark);}\n  .rescard__stats{display:flex;gap:20px;}\n  .rescard__stat .v{font-size:19px;font-weight:800;color:#fff;letter-spacing:-0.02em;}\n  .rescard__stat .k{font-size:12px;font-weight:600;color:var(--mut-dark);margin-top:1px;}\n\n  /* ===== TECH COMPARISON ===== */\n  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px;}\n  .cmp__col{border-radius:var(--r);padding:30px 28px;}\n  .cmp__bad{background:var(--white);border:1px solid var(--bd-light);}\n  .cmp__good{background:var(--ink);border:1px solid var(--violet);box-shadow:0 24px 60px rgba(124,58,237,.18);}\n  .cmp__h{display:flex;align-items:center;gap:12px;margin-bottom:22px;padding-bottom:20px;border-bottom:1px solid var(--bd-light);}\n  .cmp__good .cmp__h{border-color:var(--bd-dark);}\n  .cmp__tag{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:5px 11px;border-radius:999px;}\n  .cmp__bad .cmp__tag{background:#f1e0df;color:#b5483f;}\n  .cmp__good .cmp__tag{background:var(--lime);color:var(--ink);}\n  .cmp__col h3{font-size:19px;}\n  .cmp__good h3{color:#fff;}\n  .cmp__list{display:flex;flex-direction:column;gap:18px;}\n  .cmp__item{display:flex;gap:14px;align-items:flex-start;}\n  .cmp__item .ci{flex-shrink:0;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;margin-top:1px;}\n  .cmp__bad .ci{background:#f1e0df;}\n  .cmp__good .ci{background:rgba(163,230,53,.16);}\n  .cmp__item .ct{font-weight:700;font-size:15.5px;}\n  .cmp__good .ct{color:var(--on-dark);}\n  .cmp__item .cd{font-size:13.5px;line-height:1.5;margin-top:3px;}\n  .cmp__bad .cd{color:var(--mut-light);}\n  .cmp__good .cd{color:var(--mut-dark);}\n\n  /* ===== 3 STEPS ===== */\n  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:8px;}\n  .step{position:relative;overflow:hidden;background:var(--ink-2);border:1px solid var(--bd-dark);border-radius:20px;padding:52px 36px 44px;min-height:230px;display:flex;flex-direction:column;justify-content:flex-end;transition:border-color .2s, transform .15s;}\n  .step:hover{border-color:rgba(163,230,53,.4);transform:translateY(-3px);}\n  .step__n{font-family:inherit;font-size:128px;font-weight:800;line-height:.8;letter-spacing:-0.05em;color:transparent;-webkit-text-stroke:2px rgba(163,230,53,.55);text-stroke:2px rgba(163,230,53,.55);position:absolute;top:24px;right:30px;pointer-events:none;}\n  .step h3{font-size:27px;color:#fff;letter-spacing:-0.02em;position:relative;}\n\n  /* ===== PRICING ===== */\n  .price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:8px;}\n  .plan{\n    background:var(--white);border:1px solid var(--bd-light);border-radius:var(--r);\n    padding:32px 28px;display:flex;flex-direction:column;\n    transition:transform .15s, box-shadow .2s;\n  }\n  .plan:hover{transform:translateY(-3px);box-shadow:0 20px 50px rgba(19,19,31 -details-marker{display:none;}\n  .faq summary .pm{flex-shrink:0;width:26px;height:26px;border-radius:8px;background:var(--violet-soft);color:var(--violet);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;transition:transform .2s;}\n  .faq details[open] summary .pm{transform:rotate(45deg);}\n  .faq details p{padding:0 4px 22px;color:var(--mut-light);font-size:15.5px;line-height:1.65;max-width:680px;}\n\n  /* ===== FINAL CTA ===== */\n  .final{position:relative;overflow:hidden;text-align:center;padding:110px 0;}\n  .final__glow{position:absolute;inset:0;background:radial-gradient(ellipse 70% 90% at 50% 120%,rgba(124,58,237,.5),transparent 70%);pointer-events:none;}\n  .final h2{position:relative;font-size:clamp(30px,4.5vw,52px);color:#fff;max-width:760px;margin:0 auto 18px;}\n  .final p{position:relative;color:var(--mut-dark);font-size:19px;max-width:540px;margin:0 auto 36px;}\n  .final__ctas{position:relative;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}\n\n  /* ===== FOOTER ===== */\n  footer{background:#0e0e18;color:var(--mut-dark);padding:60px 0 40px;border-top:1px solid var(--bd-dark);}\n  .foot__top{display:flex;justify-content:space-between;gap:40px;flex-wrap:wrap;padding-bottom:40px;border-bottom:1px solid var(--bd-dark);}\n  .foot__brand{max-width:300px;}\n  .foot__brand .logo{margin-bottom:14px;}\n  .foot__brand p{font-size:14px;line-height:1.6;}\n  .foot__cols{display:flex;gap:64px;flex-wrap:wrap;}\n  .foot__col h4{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:#fff;margin-bottom:16px;font-weight:700;}\n  .foot__col a,.foot__col span{display:block;font-size:14.5px;margin-bottom:11px;color:var(--mut-dark);transition:color .15s;}\n  .foot__col a:hover{color:var(--on-dark);}\n  .foot__legal{padding-top:28px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:12.5px;line-height:1.7;}\n  .foot__legal a{text-decoration:underline;text-underline-offset:2px;}\n  .discl
